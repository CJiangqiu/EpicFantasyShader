plugins {
    id 'base'
}

// 发布文件名由导出名称与版本号拼接，版本中的点号保持不变。
def exportName = 'EpicFantasy'
version = '1.0.0'

// Gradle 的缓存报告与中间产物独立存放，build 仅用于发布 ZIP。
layout.buildDirectory = layout.projectDirectory.dir('.artifacts/gradle-build')

if (!(exportName ==~ /[A-Za-z0-9][A-Za-z0-9_-]*/) || !(version ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException('导出名称或版本号格式无效。')
}

apply from: 'gradle/validation.gradle'

tasks.register('shaderpack', Zip) {
    group = 'build'
    description = '校验光影并生成带版本号的发布 ZIP。'
    dependsOn tasks.named('validateShaders')
    archiveFileName = "${exportName}_${project.version}.zip"
    destinationDirectory = layout.projectDirectory.dir('build')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from('shaders') {
        into 'shaders'
        include '**/*.vsh', '**/*.fsh', '**/*.glsl', '**/*.properties',
            '**/*.lang', '**/*.png', '**/*.mcmeta'
    }
    includeEmptyDirs = false
}

tasks.register('verifyShaderpack') {
    group = 'verification'
    description = '检查发布 ZIP 的根目录、文件集合与校验和。'
    dependsOn tasks.named('shaderpack')
    doLast {
        def archive = tasks.named('shaderpack', Zip).get().archiveFile.get().asFile
        def expected = fileTree('shaders') {
            include '**/*.vsh', '**/*.fsh', '**/*.glsl', '**/*.properties',
                '**/*.lang', '**/*.png', '**/*.mcmeta'
        }.files.collect { relativePath(it).replace('\\', '/') }.toSet()
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def entries = Collections.list(zip.entries())
            def files = entries.findAll { !it.directory }
            if (!entries.every { it.name.startsWith('shaders/') }
                || files.collect { it.name }.toSet() != expected || files.size() != expected.size()) {
                throw new GradleException('发布包的文件集合与运行资源不一致。')
            }
            entries.each { entry ->
                def crc = new java.util.zip.CRC32()
                zip.getInputStream(entry).withCloseable { input ->
                    byte[] buffer = new byte[8192]
                    int count
                    while ((count = input.read(buffer)) != -1) { crc.update(buffer, 0, count) }
                }
                if (crc.value != entry.crc) { throw new GradleException("ZIP 校验失败：${entry.name}") }
            }
        }
        logger.lifecycle("发布包校验通过：${archive.name}")
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('verifyShaderpack')
}

tasks.named('check') {
    dependsOn tasks.named('validateShaders')
}

tasks.named('clean') {
    delete layout.projectDirectory.dir('build')
}
