uniform.float.auroraColdFactor=smooth(91, if(temperature <= 0.15, 1.0, 0.0), 5.0, 5.0)

uniform.float.cloudHumidity=smooth(92, rainfall, 60.0, 60.0)
#ifdef BIOME_MEADOW
variable.bool.cloudPlateau=in(biome, BIOME_MEADOW, BIOME_FROZEN_PEAKS, BIOME_JAGGED_PEAKS, BIOME_STONY_PEAKS, BIOME_SAVANNA_PLATEAU, BIOME_WINDSWEPT_SAVANNA, BIOME_WOODED_BADLANDS)
#else
variable.bool.cloudPlateau=0 == 1
#endif
uniform.float.cloudHighland=smooth(93, if(biome_category == CAT_EXTREME_HILLS || cloudPlateau, 1.0, 0.0), 60.0, 60.0)

#ifdef IS_IRIS
uniform.float.cloudLightningPulse=max(smooth(96, lightningBoltPosition.w, 0.015, 0.04)-smooth(97, lightningBoltPosition.w, 0.18, 0.18), 0.0)
#endif

uniform.float.waterOcean=smooth(94, if(biome_category == CAT_OCEAN, 1.0, 0.0), 40.0, 40.0)
uniform.float.waterRiver=smooth(95, if(biome_category == CAT_RIVER, 1.0, 0.0), 40.0, 40.0)
